server.port=${SERVER_PORT:8080}
spring.application.name=round-up
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=5s
springdoc.paths-to-match=/api/**
starling.base-url=${STARLING_BASE_URL:https://api-sandbox.starlingbank.com}
starling.access-token=${STARLING_ACCESS_TOKEN:}
starling.user-agent=${STARLING_USER_AGENT:round-up/1.0}
starling.max-attempts=3
starling.retry-delay=100ms
